<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYBE 2026 | Admin Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="login-page">
        <section class="login-card">

            <a href="index.html" class="login-logo">
                VYBE <span>2026</span>
            </a>

            <div class="login-decoration"></div>

            <p class="login-eyebrow">CULTURAL FEST MANAGEMENT</p>

            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Sign in to access your VYBE admin dashboard.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Admin Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <p id="loginMessage" class="login-message" aria-live="polite"></p>

                <button type="submit" id="loginButton" class="login-button">
                    <span>Sign In</span>
                    <span class="button-arrow">→</span>
                </button>

            </form>

            <div class="login-footer">
                <span class="footer-line"></span>
                <p>VYBE 2026 · Admin Portal</p>
                <span class="footer-line"></span>
            </div>

            <a href="index.html" class="back-home">← Back to Home</a>

        </section>

        <div class="login-side-decoration decoration-one"></div>
        <div class="login-side-decoration decoration-two"></div>

    </main>

    <script src="js/login.js"></script>

</body>
</html>
